# vet and test on both platforms linfer runs on. The tests need no GPU, no
# model and no network: the backend is faked, the downloads hit a local
# server, and the hardware is read from canned command output.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The current Go, not go.mod's minimum: Go 1.22's linker leaves out the
      # LC_UUID load command, and the macOS runner's dyld refuses to start a
      # test binary without it.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -count=1 ./...
